[pytest]
# D12 (audit 2026-08-19). There was no pytest config at all, which meant:
#   1. No testpaths -> a bare `pytest` from this directory collected the ~54
#      scratch test_*.py scripts sitting at the backend root. Most of them call
#      asyncio.run(...) at module scope, so collection itself fired live HTTPS
#      crawls (measured: 3m26s and 8 errors, vs 12s and 2 errors for tests/).
#   2. asyncio_mode unset -> strict, so every async test needed an explicit
#      @pytest.mark.asyncio and anything missing one silently no-op'd.
#
# rootdir stays this directory so tests/__init__.py keeps putting the backend
# root on sys.path — that is what makes `from engine...` / `from crawler...`
# resolve inside the suite.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
minversion = 7.0
addopts = -v --tb=short --strict-markers
